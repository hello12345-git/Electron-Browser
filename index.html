<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Electron Mini Browser</title>
  <style>
    body {
      margin: 0;
      padding: 10px;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 98vh;
    }
    .toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    input[type="url"] {
      flex: 1;
      padding: 8px;
      font-size: 14px;
    }
    button {
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
    }
    webview {
      flex: 1;
      width: 100%;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <div class="toolbar">
    <input type="url" id="urlInput" value="https://github.com" placeholder="https://...">
    <button onclick="navigate()">Go</button>
  </div>

  <!-- The webview tag loads any website directly -->
  <webview id="browser" src="https://github.com"></webview>

  <script>
    const webview = document.getElementById('browser');
    const urlInput = document.getElementById('urlInput');

    function navigate() {
      let url = urlInput.value;
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url;
      }
      webview.src = url;
    }

    // Keep the URL bar updated when navigating inside the webview
    webview.addEventListener('did-navigate', (event) => {
      urlInput.value = event.url;
    });
  </script>

</body>
</html>
